apiVersion: v1
kind: Service
metadata:
  name: {{ include "tetriz.fullname" . }}
  labels:
    {{- include "tetriz.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "tetriz.selectorLabels" (dict "ctx" . "component" "runner") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
