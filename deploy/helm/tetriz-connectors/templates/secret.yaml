{{- include "tetriz.validate" . }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tetriz.fullname" . }}
  labels:
    {{- include "tetriz.labels" . | nindent 4 }}
type: Opaque
stringData:
  TETRIZ_POSTGRES_DSN: {{ .Values.secrets.postgresDsn | quote }}
  {{- with .Values.secrets.credentialsKey }}
  TETRIZ_CREDENTIALS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubAppPrivateKey }}
  TETRIZ_GITHUB_APP_PRIVATE_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.redisUrl }}
  TETRIZ_REDIS_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.redisPassword }}
  TETRIZ_REDIS_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.sinkPostgresDsn }}
  TETRIZ_SINK_POSTGRES_DSN: {{ . | quote }}
  {{- end }}
  {{- range $vendor, $secret := .Values.secrets.oauthClientSecrets }}
  {{- if $secret }}
  {{ include "tetriz.oauthVar" $vendor }}CLIENT_SECRET: {{ $secret | quote }}
  {{- end }}
  {{- end }}
{{- end }}
