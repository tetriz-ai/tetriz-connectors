//go:generate go run github.com/tetriz-ai/tetriz-connectors/internal/tools/genenum -types=BitbucketRepoStatus
syntax = "proto3";

package tetriz.connectors.bitbucket.v1;

option go_package = "github.com/tetriz-ai/tetriz-connectors/gen/bitbucket/v1;bitbucketpb";

// BitbucketRepoStatus is the lifecycle state recorded on each entry in
// BitbucketSettings.DiscoveredRepos. The connector persists this inside the
// settings JSONB blob; gen_sql provides MarshalJSON / UnmarshalJSON so the
// wire format is the proto enum name string.
//
// No per-repo FORBIDDEN state today: Bitbucket 403s come from many sources
// (token revoked, app removed, 2FA enforcement, IP allowlist, anti-abuse)
// and most are token-wide. vendorapi conservatively maps every 403 to
// ErrKindAuth → repoErrAuth → fail the run. Recovering a "per-repo
// forbidden" interpretation would need a post-loop aggregator comparing
// failure patterns across the workspace; if/when that lands a new value
// can be added.
enum BitbucketRepoStatus {
  // UNSPECIFIED is the parse fallback — UnmarshalJSON resolves unknown
  // names to this. Live records always carry an explicit ACTIVE or
  // DELETED value set by fetch_repos or the per-repo error path.
  BITBUCKET_REPO_STATUS_UNSPECIFIED = 0;
  // ACTIVE means the repo was observed live during the last fetch_repos
  // run and is included in pull operations.
  BITBUCKET_REPO_STATUS_ACTIVE = 1;
  // DELETED means fetch_repos last observed a 404 for this repo. Pull
  // operations skip it until fetch_repos reconciles (vendor restored it).
  BITBUCKET_REPO_STATUS_DELETED = 2;
}
