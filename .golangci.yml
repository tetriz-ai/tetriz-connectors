version: "2"
linters:
  default: standard
  enable:
    - misspell
    - revive
  settings:
    revive:
      # revive's default rules, listed so two can be off:
      # - exported: off. Many exported identifiers have no doc comment, and
      #   the rule would force boilerplate.
      # - unused-parameter: almost every hit is a method that implements an
      #   interface or a callback signature, where the parameter must stay.
      rules:
        - name: blank-imports
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: strict
    paths:
      - third_party
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: strict
    paths:
      - third_party
